[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gameops"
version = "0.1.0"
description = "集成调度多款二游辅助软件（MAA/maaend/BGI 等）完成日常，并生成日志报告发送邮件/微信"
requires-python = ">=3.10"
dependencies = [
    "loguru>=0.7",
    "PyYAML>=6.0",
    "APScheduler>=3.10",
    "requests>=2.31",
]

[project.optional-dependencies]
gui = ["PySide6>=6.6"]
automation = ["pywin32>=306", "opencv-python>=4.8"]
dev = ["pytest>=8.0"]

[tool.hatch.build.targets.wheel]
packages = ["gameops"]

[tool.pytest.ini_options]
testpaths = ["tests"]
