app:
  name: maagent
  timezone: Asia/Shanghai
  log_dir: logs

workflow:
  game: "明日方舟"
  window_timeout: 40
  startup_settle_seconds: 25
  start_timeout: 60
  daily_timeout_seconds: 3600
  min_runtime_seconds: 90
  poll_interval: 10
  clean_start: true
  auto_close: false            # 任务完成并发送报告后，自动关闭 MAA 与模拟器

weekly:
  enabled: true                # 周常总开关
  potion:                      # 体力药刷取
    enabled: true              # 条目启用；未启用则始终关闭「使用药剂」
    days: []                   # 使用体力药的日子，周一=0 ... 周日=6
  annihilation:                # 剿灭刷取
    enabled: false             # 条目启用；未启用则始终取消勾选「剿灭刷取」
    day: null                  # 刷取日（仅一天），周一=0 ... 周日=6
    cap: 1800                  # 剿灭模式每周上限，达到即视为完成

monthly:
  enabled: true                # 月常总开关
  green:                       # 绿票商店
    enabled: false             # 启用后每月自动购买一次
  yellow:                      # 黄票商店
    enabled: false             # 启用后每月自动购买一次
  state_file: logs/monthly_state.json
  timeout_seconds: 900         # 单次购买任务超时

adapters:
  maa:
    enabled: true
    path: "D:/MAA"
    executable: "D:/MAA/MAA.exe"
    wait_seconds: 10
    emulator:
      manager_path: "D:/tools/MuMuPlayer/nx_main/MuMuManager.exe"
      vmindex: 0
    popup_monitor:
      interval: 2.0
      dismiss_checkbox: false
      debug_dir: "logs/popups"
  maaend:
    enabled: true
    path: "D:/MaaEnd-win-x86_64-v2.7.0"
    executable: "D:/MaaEnd-win-x86_64-v2.7.0/MaaEnd.exe"
    wait_seconds: 30            # 启动后等待主窗口的时间
    log_dir: "D:/MaaEnd-win-x86_64-v2.7.0/debug"   # 会话日志所在目录
    web_port: 12701
    game_process: "Endfield.exe"
    game_start_timeout: 240     # 等待终末地进程启动
    task_timeout_seconds: 3600  # 等待任务结束（进程退出）的上限

notify:
  email:
    enabled: false
    smtp_host: "smtp.qq.com"
    smtp_port: 465
    username: "your@qq.com"
    password: ""
    to: ["your@qq.com"]
  wechat:
    enabled: false
    webhook_url: ""
