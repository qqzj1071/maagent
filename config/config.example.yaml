app:
  name: maagent
  timezone: Asia/Shanghai
  log_dir: logs
  minimize_to_tray: true         # 关闭窗口时最小化到托盘，定时任务继续运行
  language: zh_CN                # zh_CN | zh_TW | en | ja
  theme: light                   # light | dark
  autostart: false               # 开机自启动
  schedule_warning: true         # 定时启动前弹出提醒
  schedule_warning_minutes: 5    # 提前多少分钟提醒
  hotkeys:                       # 全局快捷键（作用于当前选中卡片）
    start: F8                    # 开始任务
    stop: F9                     # 强制结束任务

workflow:
  game: "明日方舟"
  window_timeout: 40
  startup_settle_seconds: 25
  start_timeout: 60
  daily_timeout_seconds: 3600
  min_runtime_seconds: 90
  poll_interval: 10
  clean_start: true
  auto_close: true             # 任务完成并发送报告后，自动关闭 MAA 与模拟器
  chain:                       # 日常工作流（编排顺序 + 定时执行）
    enabled: false             # 定时总开关
    mode: sequential           # sequential=整链定时 | scheduled=逐条定时
    start_slots:               # 整链模式：每个启动时间点各自绑定运行日
      - time: "08:00"          # 该时间点
        days: [0, 1, 2, 3, 4, 5, 6]  # 该时间点运行的星期（周一=0 ... 周日=6）
    grace_minutes: 30          # 错过时间后的补跑窗口（分钟）
    state_file: logs/schedule_state.json
    sequential_tasks:          # 整链模式：每个日常仅一条，列表顺序即执行顺序
      - id: maa-1              # 稳定 id（用于跨重启保持）
        software: maa
        enabled: true
      - id: maaend-1
        software: maaend
        enabled: true
    scheduled_tasks:           # 逐条模式：可复制同一条目并各自设置时间/星期
      - id: maa-1              # 复制后需唯一，用于按天去重
        software: maa
        enabled: true
        time: "08:00"
        days: [0, 1, 2, 3, 4, 5, 6]
      - id: maaend-1
        software: maaend
        enabled: true
        time: "08:00"
        days: [0, 1, 2, 3, 4, 5, 6]

weekly:
  enabled: true                # 周常总开关
  potion:                      # 体力药刷取
    enabled: true              # 条目启用；未启用则始终关闭「使用药剂」
    days: [0]                  # 使用体力药的日子，周一=0 ... 周日=6
  annihilation:                # 剿灭刷取
    enabled: true              # 条目启用；未启用则始终取消勾选「剿灭刷取」
    day: 0                     # 刷取日（仅一天），周一=0 ... 周日=6
    cap: 1800                  # 剿灭模式每周上限，达到即视为完成

monthly:
  enabled: true                # 月常总开关
  green:                       # 绿票商店
    enabled: true              # 启用后每月自动购买一次
  yellow:                      # 黄票商店
    enabled: false             # 启用后每月自动购买一次
  state_file: logs/monthly_state.json
  timeout_seconds: 900         # 单次购买任务超时

adapters:
  maa:
    enabled: true
    path: "D:/MAA"
    executable: "D:/MAA/MAA.exe"
    wait_seconds: 10
    emulator:
      manager_path: "D:/tools/MuMuPlayer/nx_main/MuMuManager.exe"
      adb_path: "D:/tools/MuMuPlayer/nx_main/adb.exe"
      vmindex: 0
    popup_monitor:
      interval: 2.0
      dismiss_checkbox: false
      debug_dir: "logs/popups"
  maaend:
    enabled: true
    path: "D:/MaaEnd-win-x86_64-v2.7.0"
    executable: "D:/MaaEnd-win-x86_64-v2.7.0/MaaEnd.exe"
    wait_seconds: 30            # 启动后等待主窗口的时间
    auto_close: true            # 任务完成并发送报告后自动关闭 MaaEnd 与终末地
    log_dir: "D:/MaaEnd-win-x86_64-v2.7.0/debug"   # 会话日志所在目录
    web_port: 12701
    game_process: "Endfield.exe"
    game_start_timeout: 300     # 等待终末地进程启动并进入运行状态
    task_timeout_seconds: 3600  # 等待任务结束（进程退出）的上限

agent:                            # 对话式 agent（OpenAI 兼容接口）
  enabled: false                  # 预留：GUI/手机端是否展示对话入口
  name: "维维美"                   # agent 的名字
  alias: "小维、维神"              # 昵称/别名
  provider: zhipu                 # 目前仅内置智谱预设
  base_url: "https://open.bigmodel.cn/api/paas/v4"
  api_key: ""                     # 智谱 API Key；也可用环境变量 ZHIPU_API_KEY
  model: "glm-4.5-flash"          # 主脑（文本 + 工具调用，免费；glm-4.7-flash 高峰期常过载）
  vision_model: "glm-4.1v-thinking-flash"  # 视觉模型（免费，带图时使用）
  temperature: 0.5
  max_steps: 8                    # 单轮最多工具调用步数
  max_tool_calls: 3               # 受限工具每回合最多调用次数（防搜索空转）
  repeat_limited_tools: ["web_search", "search_knowledge"]  # 仅这些工具做去重/限次，其余（截图等）可重复调用
  history_limit: 40               # 携带的历史消息条数
  timeout: 90
  memory_file: "config/agent_memory.json"  # 长期记忆（事实/偏好/技能）
  knowledge_file: "config/agent_knowledge.json"  # PRTS 知识库（scripts/build_knowledge.py 生成）
  search:                         # 免费联网搜索（免 key、零调用费）
    enabled: true
    backend: auto                 # auto | duckduckgo | bing
    count: 5                      # 默认返回条数
    timeout: 15
    proxy: ""                     # 如 http://127.0.0.1:7897；留空直连
  game:                           # 模拟器/游戏控制（视觉识别 + 点击）
    enabled: false                # 开启后允许 agent 启动模拟器、打开明日方舟、看画面
    package: "com.hypergryph.arknights"  # 明日方舟默认包名（官服）
    window_process: "MuMuNxDevice.exe"   # 模拟器窗口进程（用于置前）
    focus_before_capture: true    # 看画面/截图前自动把模拟器窗口置前
    screenshot_dir: "logs/agent_game"  # 截图目录（frozen 时自动改为用户数据目录）
    max_screenshots: 50           # 最多保留最近多少张截图
  persona: ""                     # 自定义人设，留空用默认

notify:
  email:
    enabled: false
    smtp_host: "smtp.qq.com"
    smtp_port: 465
    username: "your@qq.com"
    password: ""
    to: ["your@qq.com"]
    send_log_on: [success, warning, failed, stopped]  # 附带当天任务日志的场景（可多选）：success=任务完成 / warning=完成但有子任务报错 / failed=任务失败 / stopped=任务急停
  wechat:
    enabled: false
    webhook_url: ""

server:                          # 账号 / 手机远程控制服务（公网直连）
  enabled: false                 # true 时随 GUI 启动；GUI 与手机共用同一工作流控制器
  host: "tailscale"              # "tailscale"=仅监听 127.0.0.1，供 Tailscale Funnel/Serve 代理（推荐）；也可填 0.0.0.0 或具体 IP
  port: 8765
  db_path: "config/accounts.db"  # SQLite 数据库位置
  report_file: "logs/reports.jsonl"  # 远程报告持久化位置（手机端读取）
  account_login: ""              # 当前登录账号（邮箱或本机用户名；设置→账户 登录后自动写入；未登录不启动远程服务）
  account_name: ""               # 当前登录账号的显示名（本机账号的用户名；主界面右上角显示）
  account_phone: ""              # 当前登录账号绑定的手机号（用于手机端登录；主界面账号栏显示）
  account_email: ""              # 当前登录账号邮箱（仅邮箱账号有；本机账号为空，报告不发邮件）
  public_url: ""                 # 手机网页公网地址；留空则自动用 Tailscale Funnel 域名
  auto_setup: true               # 首次启动提示一键配置手机远程（自动装 Tailscale + 启用 Funnel）
  setup_prompted: false          # 是否已提示过（内部使用）
  last_notified_email: ""        # 已发送过网页地址邮件的账号（内部使用）
  debug: false                   # true 时验证码直接返回在响应里（仅本地调试，切勿公网开启）
  allow_register: true           # 是否开放注册
  token_ttl_hours: 720           # 登录令牌有效期（30 天）
  code_ttl_minutes: 10           # 邮箱验证码有效期
  code_length: 6                 # 验证码位数
  code_cooldown_seconds: 60      # 同一邮箱同用途两次发码的最小间隔
  code_hourly_limit: 10          # 同一邮箱每小时最多发码次数
  max_code_attempts: 5           # 单个验证码最多尝试次数
  min_password_length: 8         # 密码最小长度
  tls:                           # 公网直连强烈建议启用 HTTPS
    certfile: ""                 # 例如 D:/certs/fullchain.pem
    keyfile: ""                  # 例如 D:/certs/privkey.pem
