app:
  name: maagent
  timezone: Asia/Shanghai
  log_dir: logs

workflow:
  game: "明日方舟"
  window_timeout: 40
  startup_settle_seconds: 25
  start_timeout: 60
  daily_timeout_seconds: 3600
  min_runtime_seconds: 90
  poll_interval: 10
  clean_start: true
  auto_close: false            # 任务完成并发送报告后，自动关闭 MAA 与模拟器

weekly:
  enabled: true                # 周常总开关
  potion:                      # 体力药刷取
    enabled: true              # 条目启用；未启用则始终关闭「使用药剂」
    days: []                   # 使用体力药的日子，周一=0 ... 周日=6
  annihilation:                # 剿灭刷取
    enabled: false             # 条目启用；未启用则始终取消勾选「剿灭刷取」
    day: null                  # 刷取日（仅一天），周一=0 ... 周日=6
    weekly_limit: 5            # 每周剿灭次数上限
    sanity_threshold: 124      # 达标所需消耗理智

adapters:
  maa:
    enabled: true
    path: "D:/MAA"
    executable: "D:/MAA/MAA.exe"
    wait_seconds: 10
    emulator:
      manager_path: "D:/tools/MuMuPlayer/nx_main/MuMuManager.exe"
      vmindex: 0
    popup_monitor:
      interval: 2.0
      dismiss_checkbox: false
      debug_dir: "logs/popups"

notify:
  email:
    enabled: false
    smtp_host: "smtp.qq.com"
    smtp_port: 465
    username: "your@qq.com"
    password: ""
    to: ["your@qq.com"]
  wechat:
    enabled: false
    webhook_url: ""
